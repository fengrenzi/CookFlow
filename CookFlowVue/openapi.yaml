openapi: 3.0.3
info:
  title: CookFlow2 API
  version: 1.0.0
  description: API spec generated from frontend for CookFlow2 (for generating Spring Boot backend)
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/logout:
    post:
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: logged out

  /auth/me:
    get:
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /recipes:
    get:
      summary: List recipes
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: size
          schema:
            type: integer
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: paged recipes
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'
    post:
      summary: Create recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recipe'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'

  /recipes/{id}:
    get:
      summary: Get recipe by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
    put:
      summary: Update recipe
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recipe'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
    delete:
      summary: Delete recipe
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: deleted

  /recipes/{id}/favorite:
    post:
      summary: Toggle favorite for recipe (authenticated)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: favorite toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorite:
                    type: boolean

  /ingredients/categories:
    get:
      summary: Get ingredient categories (grouped)
      responses:
        '200':
          description: categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /ingredients:
    get:
      summary: List ingredients
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: letter
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: size
          schema:
            type: integer
      responses:
        '200':
          description: ingredient list
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ingredient'
    post:
      summary: (optional) create ingredient
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ingredient'
      responses:
        '201':
          description: created

  /ingredients/{id}:
    get:
      summary: Get ingredient detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ingredient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'

  /ingredients/recommendations:
    post:
      summary: Recommend recipes from selected ingredients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selectedIngredientIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: recommended recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'

  /ingredient-detail/{id}:
    get:
      summary: Ingredient detail page content (carousel, tips, steps, nutrition, knowledge)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ingredient detail content
          content:
            application/json:
              schema:
                type: object
                properties:
                  carouselItems:
                    type: array
                    items:
                      $ref: '#/components/schemas/CarouselItem'
                  selectionTips:
                    type: array
                    items:
                      $ref: '#/components/schemas/TipItem'
                  processingSteps:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProcessingStep'
                  nutritionData:
                    type: array
                    items:
                      $ref: '#/components/schemas/Nutrient'
                  knowledgePoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgePoint'

  /home/images:
    get:
      summary: Home carousel images
      responses:
        '200':
          description: images
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /home/categories:
    get:
      summary: Home categories (summary)
      responses:
        '200':
          description: categories

  /home/recipes:
    get:
      summary: Home recipes (recommended/latest)
      responses:
        '200':
          description: recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'

  /home/recommends:
    get:
      summary: Personalized recommendations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: recommended recipes

  /cart:
    get:
      summary: Get current user's cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: cart items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'

  /cart/items:
    post:
      summary: Add item to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItem'
      responses:
        '201':
          description: created

  /cart/items/{id}:
    put:
      summary: Update cart item (quantity)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: updated
    delete:
      summary: Remove cart item
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: removed

  /cart/checkout:
    post:
      summary: Checkout cart
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: checkout result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  shoppingList:
                    type: string

  /books:
    get:
      summary: List books
      responses:
        '200':
          description: books

  /books/{id}:
    get:
      summary: Get book detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: book

  /books/{bookId}/recipes/{pageNumber}:
    get:
      summary: Get recipe in book by page
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
        - in: path
          name: pageNumber
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'

  /users/{username}:
    get:
      summary: Get user profile
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      summary: Update user profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: updated

  /search:
    get:
      summary: Search across resources
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [recipes, ingredients, books]
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: size
          schema:
            type: integer
      responses:
        '200':
          description: search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'
                  ingredients:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ingredient'
                  books:
                    type: array

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        detail:
          type: object

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        username:
          type: string

    UserProfile:
      type: object
      properties:
        username:
          type: string
        avatar:
          type: string
        bio:
          type: string
        favorites:
          type: array
          items:
            type: integer

    Recipe:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        image:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        steps:
          type: array
          items:
            type: string
        category:
          type: string
        prepTime:
          type: integer
        cookTime:
          type: integer

    Ingredient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        imgUrl:
          type: string
        image:
          type: string
        category:
          type: string
        letter:
          type: string
        unit:
          type: string
        amount:
          type: number

    CarouselItem:
      type: object
      properties:
        imageUrl:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        features:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string

    TipItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string

    ProcessingStep:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        image:
          type: string

    Nutrient:
      type: object
      properties:
        name:
          type: string
        value:
          type: string

    KnowledgePoint:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string

    CartItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [recipe, book]
        addedTime:
          type: string
          format: date-time
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        quantity:
          type: integer
        recipeId:
          type: string
        recipeName:
          type: string
        recipeImageUrl:
          type: string
        bookId:
          type: string
        bookName:
          type: string
        bookImageUrl:
          type: string
        pageNumber:
          type: integer

    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
